services:
  db:
    image: postgres:15
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database_backups:/backups
    ports:
      - "127.0.0.1:5433:5432"
    restart: always
    command: postgres -c listen_addresses='*'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domanda -d domanda_software"]
      interval: 30s
      timeout: 10s
      retries: 3

  backend:
    build: ./backend
    command: >
      sh -c "python manage.py migrate &&
             python init_data.py &&
             python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8000"
    volumes:
      - ./backend/media:/app/media
      - ./backend/static:/app/static
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        - VITE_API_URL=${VITE_API_URL}
        - VITE_GOOGLE_CLIENT_ID=${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "3088:80"
    depends_on:
      - backend
    restart: unless-stopped

  # Servizio per backup automatico del database
  db-backup:
    image: postgres:15
    depends_on:
      - db
    env_file:
      - .env
    volumes:
      - ./database_backups:/backups
    command: >
      sh -c "
      while true; do
        sleep 3600;
        echo 'Creando backup database...';
        pg_dump -h db -U domanda -d domanda_software > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql;
        echo 'Backup completato';
        find /backups -name '*.sql' -mtime +7 -delete;
      done"
    restart: unless-stopped

  adminer:
    image: adminer
    restart: always
    ports:
      - "8089:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    depends_on:
      - db

volumes:
  postgres_data:
    driver: local 
